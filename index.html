<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Интерактивная 3D-Тыква | XR-проект</title>
  <!-- Подключаем model-viewer -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    :root {
      --primary: #ff7e00; /* Оранжевый цвет тыквы */
      --bg-color: #1a1a1a;
      --text-color: #f0f0f0;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    header {
      text-align: center;
      padding: 20px 0;
      width: 100%;
      background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(26,26,26,0) 100%);
      position: absolute;
      top: 0;
      z-index: 10;
      pointer-events: none;
    }
    h1 {
      margin: 0;
      font-size: 2rem;
      text-shadow: 0 0 10px rgba(255, 126, 0, 0.5);
    }
    .viewer-container {
      width: 100%;
      height: 100vh;
      position: relative;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #0e1824 0%, #002238 100%);
      --poster-color: transparent;
    }
    /* Стилизация кнопки AR, которую добавляет model-viewer */
    model-viewer::part(default-ar-button) {
      background-color: var(--primary);
      border-radius: 50px;
      box-shadow: 0 4px 15px rgba(255, 126, 0, 0.4);
    }
  </style>
</head>
<body>

  <header>
    <h1>🎃 Магическая Тыква</h1>
    <p>Управляй магией в реальном времени</p>
  </header>

  <div class="viewer-container">
    <!-- Добавляем autoplay и animation-name -->
    <model-viewer 
      id="pumpkinViewer"
      src="assets/pumpkin2.glb" 
      alt="3D модель тыквы для XR проекта"
      camera-controls 
      ar
      ar-modes="webxr scene-viewer quick-look"
      shadow-intensity="2"
      environment-image="neutral"
      exposure="1.2"
      camera-orbit="0deg 90deg 8.5m"
      camera-target="0.2m 0 0"
      min-camera-orbit="auto auto 4m"
      max-camera-orbit="auto auto 9m"
      touch-action="pan-y"
      autoplay>
    </model-viewer>

    <!-- Панель управления (Наш творческий элемент) -->
    <div class="controls-panel">
      <button id="btnPlayPause" class="btn">⏸ Пауза</button>
      <button id="btnGlow" class="btn">✨ Свечение</button>
      <button id="btnReset" class="btn">🔄 Сброс</button>
    </div>
  </div>

  <style>
    /* Добавь это в свои стили, если их еще нет */
    .controls-panel {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 15px;
      background: rgba(30, 30, 30, 0.8);
      padding: 15px 25px;
      border-radius: 30px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 20;
    }
    .btn {
      background: transparent;
      color: white;
      border: 1px solid var(--primary);
      padding: 10px 20px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease;
    }
    .btn:hover, .btn.active {
      background: var(--primary);
      color: #000;
      box-shadow: 0 0 15px var(--primary);
    }
  </style>

  <script>
    const viewer = document.getElementById('pumpkinViewer');
    const btnPlayPause = document.getElementById('btnPlayPause');
    const btnGlow = document.getElementById('btnGlow');
    const btnReset = document.getElementById('btnReset');

    viewer.addEventListener('load', () => {
      console.log('Модель загружена!');
      
      // 1. Проверяем, подхватилась ли анимация
      console.log('Доступные анимации:', viewer.availableAnimations);
      
      if (viewer.availableAnimations.length > 0) {
        // Если анимация есть, кнопка работает
        btnPlayPause.addEventListener('click', () => {
          if (viewer.paused) {
            viewer.play();
            btnPlayPause.textContent = '⏸ Пауза';
            btnPlayPause.classList.remove('active');
          } else {
            viewer.pause();
            btnPlayPause.textContent = '▶️ Играть';
            btnPlayPause.classList.add('active');
          }
        });
      } else {
        btnPlayPause.textContent = 'Нет анимации';
        btnPlayPause.disabled = true;
        console.warn('Анимация не найдена! Проверь экспорт из Blender.');
      }
    });

    // 2. Визуальный эффект "Свечение" (Меняет фон и экспозицию)
    let isGlowing = false;
    btnGlow.addEventListener('click', () => {
      isGlowing = !isGlowing;
      if (isGlowing) {
        viewer.exposure = 1.5;
        viewer.style.background = 'radial-gradient(circle at center, #ff7518 0%, #0e1824 70%)';
        btnGlow.textContent = '🌑 Свечение';
        btnGlow.classList.add('active');
      } else {
        viewer.exposure = 1.2;
        viewer.style.background = 'radial-gradient(circle at center, #0e1824 0%, #002238 100%)';
        btnGlow.textContent = '✨ Свечение';
        btnGlow.classList.remove('active');
      }
    });

    // 3. Сброс камеры
    btnReset.addEventListener('click', () => {
      viewer.cameraOrbit= "0deg 90deg 8.5m";
      viewer.cameraTarget="0.2m 0 0";
      viewer.fieldOfView = 'auto';
    });
  </script>

</body>
</html>
